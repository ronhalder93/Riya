name: Download CMU 2548 Animation Pack

on:
  push:
    paths:
      - ".github/workflows/download-cmu-animation-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face downloader
        run: python -m pip install --upgrade huggingface_hub

      - name: Download complete FBX dataset
        env:
          HF_HUB_DISABLE_XET: "0"
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          path = snapshot_download(
              repo_id="meitemouss0501-del/cmu-fbx",
              repo_type="dataset",
              local_dir="cmu-fbx-pack",
              allow_patterns=["**/*.fbx", "*.csv", "*.md", "*.txt", "LICENSE*"]
          )
          print("Downloaded dataset to:", path)
          PY

      - name: Verify animation files
        run: |
          python - <<'PY'
          from pathlib import Path
          files = list(Path("cmu-fbx-pack").rglob("*.fbx"))
          print(f"FBX animation files found: {len(files)}")
          if len(files) < 2500:
              raise SystemExit(f"Expected about 2,548 FBX files, found {len(files)}")
          PY

      - name: Create downloadable ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("cmu-fbx-pack")
          with ZipFile("RIYA-CMU-2548-Animations.zip", "w", ZIP_DEFLATED, compresslevel=1) as z:
              for p in root.rglob("*"):
                  if p.is_file() and ".cache" not in p.parts:
                      z.write(p, p.relative_to(root.parent))
          print("ZIP created")
          PY

      - name: Upload complete animation pack
        uses: actions/upload-artifact@v4
        with:
          name: RIYA-CMU-2548-Animations
          path: RIYA-CMU-2548-Animations.zip
          if-no-files-found: error
          retention-days: 14
