name: Check full RIYA animation library
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect KinemIQ public library page and list downloadable clips
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          urls = [
            "https://kinemiq.app/animations/",
            "https://kinemiq.app/free-game-animations/"
          ]
          for url in urls:
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
            data=urllib.request.urlopen(req,timeout=30).read()
            print(url, len(data), data[:200])
          PY
          npm view @gltf-transform/core version
