name: Deploy RIYA voice agent

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Deploy updates to the existing RIYA agent"
        required: true
        type: choice
        options:
          - create
          - deploy
        default: deploy

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: riya-livekit-agent
  cancel-in-progress: false

jobs:
  create-agent:
    if: inputs.operation == 'create'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create RIYA on LiveKit Cloud
        id: livekit
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ secrets.SECRET_LIST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          OPERATION: create
          WORKING_DIRECTORY: backend

      - name: Save generated LiveKit configuration
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: backend/livekit.toml
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: cloud-agent-${{ github.run_id }}
          title: "Add RIYA LiveKit agent configuration"
          commit-message: "Add RIYA LiveKit agent configuration"
          body: "Adds the LiveKit-generated agent ID and project configuration."
          base: main
          delete-branch: true

      - name: Check out generated configuration
        uses: actions/checkout@v4
        with:
          ref: cloud-agent-${{ github.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for RIYA agent to become ready
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: backend
          TIMEOUT: 5m

  deploy-agent:
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy RIYA updates
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ secrets.SECRET_LIST }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: backend
