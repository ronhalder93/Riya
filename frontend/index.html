<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RIYA</title>
<meta name="theme-color" content="#151821">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186/examples/jsm/",
    "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.8/modules/talkinghead.mjs"
} }
</script>
</head>
<body>

<div id="scene"></div>
<div id="avatarFallback" class="hidden">Avatar could not load.</div>

<header class="hud">
  <span class="brand">RIYA</span>
  <span id="activityState">IDLE</span>
  <span id="avatarState">IDLE</span>
  <button id="chatHistoryToggle" type="button" aria-controls="messages" aria-expanded="true">Hide chat</button>
  <button id="voiceToggle" aria-pressed="true">🔊 Voice ON</button>
</header>

<main id="messages"></main>

<footer class="dock">
  <div id="attachmentList"></div>

  <div class="camrow">
    <button id="cameraToggle" type="button">Start camera</button>
    <select id="qualitySelect" aria-label="Camera quality">
      <option value="144">144p</option>
      <option value="240" selected>240p</option>
      <option value="360">360p</option>
      <option value="480">480p</option>
      <option value="720">720p</option>
    </select>
    <button id="cameraStop" type="button" disabled>Stop</button>
    <video id="cameraPreview" playsinline muted></video>
  </div>
  <p id="cameraNotice">Camera is off</p>

  <form id="chatForm">
    <input id="fileInput" type="file" multiple hidden>
    <button id="attachBtn" type="button" aria-label="Attach">📎</button>
    <button id="micBtn" type="button" aria-label="Microphone">🎙</button>
    <input id="messageInput" type="text" placeholder="Type a message…" autocomplete="off">
    <button type="submit">Send</button>
  </form>
</footer>

<script type="module" src="./app.js"></script>
<script type="module" src="./avatar.js"></script>
</body>
</html>
