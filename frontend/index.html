<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="RIYA — a friendly virtual companion">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>RIYA</title>
</head>
<body>
  <main class="app-shell">
    <div id="scene" class="scene" aria-label="Live animated RIYA background"></div>
    <section class="chat" aria-label="Conversation">
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="chatForm" class="composer">
        <button id="micBtn" class="tool-btn" type="button" aria-label="Voice input">⌁</button>
        <input id="messageInput" autocomplete="off" maxlength="2000" placeholder="Message RIYA…" aria-label="Message">
        <button class="send-btn" type="submit" aria-label="Send message">↑</button>
      </form>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
