<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fc"><meta name="description" content="RIYA — a friendly virtual companion">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css?v=4"><title>RIYA</title>
</head>
<body>
<main class="app-shell">
  <div id="scene" class="scene" aria-label="RIYA avatar background"></div>
  <video id="cameraPreview" class="camera-preview" autoplay muted playsinline aria-label="Your camera preview"></video>
  <div class="camera-shade"></div>
  <div class="topbar">
    <div class="brand"><span class="brand-mark">♡</span><span>RIYA</span><small id="avatarState">READY</small></div>
    <div class="top-controls">
      <label class="quality-label" for="qualitySelect">CAM</label>
      <select id="qualitySelect" aria-label="Camera quality"><option value="144">144p</option><option value="240">240p</option><option value="360" selected>360p</option><option value="480">480p</option><option value="720">720p</option></select>
      <button id="voiceToggle" class="hud-btn" type="button" aria-pressed="true">🔊 Voice ON</button>
      <button id="cameraToggle" class="hud-btn camera-on" type="button">Start camera</button>
      <button id="cameraStop" class="hud-btn stop-btn" type="button" disabled>Stop</button>
    </div>
  </div>
  <div id="cameraNotice" class="camera-notice">Camera is off · Tap “Start camera” to enable a visible local preview</div>
  <section class="chat" aria-label="Conversation">
    <div id="messages" class="messages" aria-live="polite"></div>
    <form id="chatForm" class="composer">
      <input id="fileInput" type="file" hidden multiple>
      <button id="attachBtn" class="tool-btn" type="button" aria-label="Attach files">＋</button>
      <input id="messageInput" autocomplete="off" maxlength="2000" placeholder="Message RIYA…" aria-label="Message">
      <button id="micBtn" class="tool-btn mic-btn" type="button" aria-label="Voice input">🎙</button>
      <button class="send-btn" type="submit" aria-label="Send message">↑</button>
    </form>
    <div id="attachmentList" class="attachment-list" aria-live="polite"></div>
  </section>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module" src="./app.js"></script>
</body></html>
